<script>

let dateOverflow=false;

/* BASIC */

function hexToInt(hex){
return parseInt(hex,16);
}

function hexToSigned32(hex){

let v=parseInt(hex,16);

if(v>0x7FFFFFFF)
v-=0x100000000;

return v;
}

function hexToSigned16(hex){

let v=parseInt(hex,16);

if(v>0x7FFF)
v-=0x10000;

return v;
}

/* CRC16 MODBUS */

function calcCRC16(bytes){

let crc=0xFFFF;

for(let b of bytes){

crc^=parseInt(b,16);

for(let i=0;i<8;i++){

if(crc&1)
crc=(crc>>1)^0xA001;
else
crc>>=1;

}

}

let hex=crc.toString(16).padStart(4,'0');

let low=hex.slice(2,4);
let high=hex.slice(0,2);

return (low+high).toLowerCase();

}

/* BCD */

function bcdDecode(bytes){

let out="";

for(let b of bytes){

let v=parseInt(b,16);

let high=(v>>4)&0xF;
let low=v&0xF;

out+=high.toString();
out+=low.toString();

}

return out;

}

/* ASCII */

function asciiDecode(bytes){

let out="";

for(let b of bytes){

let v=parseInt(b,16);

out+=(v>=32&&v<=126)?String.fromCharCode(v):".";

}

return out;

}

/* TIME */

function formatTimeUTC7(hex){

let ss=parseInt(hex.slice(0,2),16);
let mm=parseInt(hex.slice(2,4),16);
let hh=parseInt(hex.slice(4,6),16);

hh+=7;

if(hh>=24){
hh-=24;
dateOverflow=true;
}else
dateOverflow=false;

return `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;

}

function formatDateWithOverflow(hex){

let dd=parseInt(hex.slice(0,2),16);
let mm=parseInt(hex.slice(2,4),16);
let yy=parseInt(hex.slice(4,6),16);

if(dateOverflow)dd++;

return `${dd.toString().padStart(2,'0')}/${mm.toString().padStart(2,'0')}/20${yy}`;

}

/* Execution time = Hour / Minute / Second, decimal value per byte */

function formatExecTime(hex){

let hh=parseInt(hex.slice(0,2),16);
let mm=parseInt(hex.slice(2,4),16);
let ss=parseInt(hex.slice(4,6),16);

return `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;

}

/* Execution function : 0500 On / 0501 Off / 04XX dimming */

function formatExecFunction(hex){

let h=hex.toLowerCase();

if(h==="0500")return "Light On";
if(h==="0501")return "Light Off";

if(h.slice(0,2)==="04")
return "Dimming "+parseInt(h.slice(2,4),16)+" %";

return "Unknown";

}

/* TABLE */

function clearTable(){

document.getElementById("result").innerHTML=`

<tr>
<th>Field</th>
<th>Hex</th>
<th>Value</th>
</tr>`;

}

function row(name,hex,val,cls=""){

let r=document.getElementById("result").insertRow();

r.style.animation="fadeIn .25s ease";

r.insertCell(0).innerText=name;
r.insertCell(1).innerText=hex===""?"":"0x"+hex;

let v=r.insertCell(2);
v.innerText=val;

if(cls)v.className=cls;

}

function frameType(name){
row("Frame Type","",name,"info");
}

/* CRC located at the end of the frame */

function crcTail(bytes){

if(bytes.length<3){
row("CRC16","","Frame too short","err");
return;
}

let crcFrame=bytes.slice(bytes.length-2).join("").toLowerCase();

let crcCalc=calcCRC16(bytes.slice(0,bytes.length-2));

let status=(crcFrame===crcCalc)?"OK":"ERROR";

row("CRC16",
crcFrame,
"Calc 0x"+crcCalc+" = "+status,
status==="OK"?"ok":"err");

}

/* total frame length check (1 byte length field) */

function lengthCheck(declared,actual){

let status=(declared===actual);

row("Length Check",
"",
actual+" bytes "+(status?"= Frame size OK":"!= declared "+declared),
status?"ok":"err");

}

function addressRow(bytes,label="Address"){

let hex=bytes.join("");

row(label,hex,hexToInt(hex)+
(hex.toLowerCase()==="ffffffff"?" (broadcast / all controllers)":""));

}

/* PARSER */

function parse(){

document.getElementById("result").style.opacity="0";

setTimeout(()=>{
document.getElementById("result").style.opacity="1";
},50);

let hexRaw=document
.getElementById("hexInput")
.value.replace(/0x/gi,'')
.replace(/[^0-9a-fA-F]/g,'')
.toLowerCase();

let bytes=hexRaw.match(/.{1,2}/g);

if(!bytes||hexRaw.length%2!==0){
alert("Invalid HEX");
return;
}

clearTable();

/* AUTO DETECT FRAME */

if(bytes[0]==="aa"&&bytes[1]==="55"){
decodeAA55(bytes);
return;
}

switch(bytes[0]){

case "25": decode25(bytes); return;
case "26": decode26(bytes); return;
case "32": decode32(bytes); return;
case "4a": decode4A(bytes); return;
case "15": decode15(bytes); return;
case "11": decodeICODE(bytes); return;
case "88": decode88(bytes); return;
case "36": decodeReset(bytes,"4.5 Reset Accumulative Device Working / Restart Times"); return;
case "37": decodeReset(bytes,"4.4 Reset Accumulative Energy"); return;
case "51": decode51(bytes); return;
case "52": decode52(bytes); return;
case "70": decode70(bytes); return;
case "a1": decodeA1(bytes); return;
case "a3": decodeA3(bytes); return;
case "a5": decodeA5(bytes); return;

}

/* fallback : assume 0x11 status frame */

decodeICODE(bytes);

}

/* ============================================================
   0xAA55 FRAMES
   Length = bytes after CRC16
   CRC is calculated over the data segment following the CRC field
   ============================================================ */

function decodeAA55(b){

row("Frame Head",b[0]+b[1],"AA55 - Data frame start");

let hdr=b.slice(4,8).join("");

/* registration / heartbeat count the whole frame,
   command frames count the bytes after CRC16 */

let isCommand=(hdr==="01000300");

let declared=hexToInt(b[2]+b[3]);

row("Length",b[2]+b[3],
declared+(isCommand?" bytes after CRC16":" bytes (total frame length)"));

let actual=isCommand?b.length-10:b.length;

if(actual!==declared){

row("Length Check",
"",
actual+" bytes != declared "+declared,
"err");

}else{

row("Length Check",
"",
actual+" bytes = Frame size OK",
"ok");

}

if(isCommand){

row("Reserved port",hdr,"Fixed");

}else{

row("Version",b[4],hexToInt(b[4]));
row("Enctype",b[5],b[5]);
row("Type",b[6],b[6]);
row("Reserved",b[7],b[7]);

}

let crcFrame=(b[8]+b[9]).toLowerCase();

let crcCalc=calcCRC16(b.slice(10));

let status=(crcFrame===crcCalc)?"OK":"ERROR";

row("CRC16",
crcFrame,
"Calc 0x"+crcCalc+" = "+status,
status==="OK"?"ok":"err");

addressRow(b.slice(10,14));

if(b.length<15){
row("Function Code","","Missing","err");
return;
}

let fc=b[14];
let p=b.slice(15);

switch(fc){

case "d0": aa55D0(fc,p); return;
case "d2": aa55D2(fc,p); return;
case "d3": aa55D3(fc,p); return;
case "d4": aa55D4(fc,p); return;
case "13": aa55Heartbeat(fc,p); return;
case "15": aa55Uplink(fc,p); return;

}

row("Function Code",fc,"Unknown","err");

if(p.length)
row("Payload",p.join(""),p.length+" bytes");

}

/* walk the serial-no. tags to see whether an IMSI block is present */

function hasIMSI(p){

let i=0;

while(i<p.length){

if(p.length-i===1)return false;

let t=p[i];

if(t==="08")return true;

if(t==="07")i+=9;
else if(t==="03"||t==="05")i+=2;
else if(t==="09")i+=4;
else i++;

}

return false;

}

/* 5.1 / 5.2 Registration & Heartbeat packet (0xD0) */

function aa55D0(fc,p){

/* registration carries IMSI (serial no. 0x08), heartbeat does not.
   the tag must be walked, an IMEI/IMSI digit byte can also be 0x08 */

frameType(hasIMSI(p)
?"5.1 Registration Packet (0xAA55 / 0xD0)"
:"5.2 Heartbeat Packet (0xAA55 / 0xD0)");

row("Function Code",fc,"0xD0 - Fixed");

let i=0;

while(i<p.length){

/* last remaining byte is the time zone */

if(p.length-i===1){

row("Time zone",p[i],"UTC+"+hexToInt(p[i]));
i++;
continue;

}

let tag=p[i];

if(tag==="07"&&p.length-i>=9){

row("Serial No.",tag,"0x07 - IMEI");
row("IMEI",p.slice(i+1,i+9).join(""),bcdDecode(p.slice(i+1,i+9)));
i+=9;

}else if(tag==="08"&&p.length-i>=9){

row("Serial No.",tag,"0x08 - IMSI");
row("IMSI",p.slice(i+1,i+9).join(""),bcdDecode(p.slice(i+1,i+9)));
i+=9;

}else if(tag==="03"&&p.length-i>=2){

row("Serial No.",tag,"0x03 - CSQ");
row("CSQ",p[i+1],hexToInt(p[i+1]));
i+=2;

}else if(tag==="05"&&p.length-i>=2){

row("Serial No.",tag,"0x05 - PCI");
row("PCI",p[i+1],hexToInt(p[i+1]));
i+=2;

}else if(tag==="09"&&p.length-i>=4){

row("Serial No.",tag,"0x09 - FW Version");

row("FW Version",
p.slice(i+1,i+4).join(""),
hexToInt(p[i+1])+"."+hexToInt(p[i+2])+"."+hexToInt(p[i+3]));

i+=4;

}else{

row("Unknown Serial No.",tag,"Unrecognized field","err");
i++;

}

}

}

/* 4.2 Light controller Mode settings (0xD2) */

function aa55D2(fc,p){

if(isAck(p)){

frameType("4.2 Light controller Mode settings - Response (0xD2)");
row("Function Code",fc,"0xD2 - Fixed");
ackRow(p);
return;

}

frameType("4.2 Light controller Mode settings (0xD2)");

row("Function Code",fc,"0xD2 - Fixed");

row("Enable Byte",p[0],p[0]==="00"?"Enable Mode":"Disable Mode");

row("Mode",p[1],
p[1]==="00"?"Schedule based control":
p[1]==="01"?"Light sensor based control":"Unknown");

row("Light Sensor Query Interval",p[2],hexToInt(p[2]));

}

/* 2.2 Query Time Strategy (0xD3) */

function aa55D3(fc,p){

if(p.length<=1){

frameType("2.2 Query Time Strategy (0xAA55 / 0xD3)");
row("Function Code",fc,"0xD3 - Fixed");
row("Strategy No.",p[0],hexToInt(p[0]));
return;

}

frameType("2.2 Query Time Strategy - Response (0xD3)");

row("Function Code",fc,"0xD3 - Fixed");

strategyBody(p);

}

/* 4.1 Single light controller strategy settings (0xD4) */

function aa55D4(fc,p){

if(isAck(p)){

frameType("4.1 Strategy Settings - Response (0xD4)");
row("Function Code",fc,"0xD4 - Fixed");
ackRow(p);
return;

}

frameType("4.1 Single light controller strategy settings (0xD4)");

row("Function Code",fc,"0xD4 - Fixed");

strategyBody(p);

}

function strategyBody(p){

row("Strategy No.",p[0],hexToInt(p[0]));

row("Enable Byte",p[1],p[1]==="00"?"Enable":"Disable");

let t1=p.slice(2,5).join("");
row("Execution time 1",t1,formatExecTime(t1));

let f1=p.slice(5,7).join("");
row("Execution function 1",f1,formatExecFunction(f1));

let t2=p.slice(7,10).join("");
row("Execution time 2",t2,formatExecTime(t2));

let f2=p.slice(10,12).join("");
row("Execution function 2",f2,formatExecFunction(f2));

}

/* 5.3 Modify interval of Heartbeat Packet (0x13) */

function aa55Heartbeat(fc,p){

if(isAck(p)){

frameType("5.3 Modify Heartbeat Interval - Response (0x13)");
row("Function Code",fc,"0x13 - Fixed");
ackRow(p);
return;

}

frameType("5.3 Modify interval of Heartbeat Packet (0x13)");

row("Function Code",fc,"0x13 - Fixed");

row("Heartbeat Interval",
p.slice(0,2).join(""),
hexToInt(p.slice(0,2).join(""))+" s");

row("Reserved",p.slice(2,4).join(""),"Fixed");

}

/* 4.3 Configure time interval of periodic reporting uplinks (0x15) */

function aa55Uplink(fc,p){

frameType("4.3 Configure interval of periodic reporting uplinks (0x15)");

row("Function Code",fc,"0x15 - Fixed");

row("Schedule Checking Timer",
p.slice(0,2).join(""),
hexToInt(p.slice(0,2).join(""))+" s");

row("Uplink Timer",
p.slice(2,4).join(""),
hexToInt(p.slice(2,4).join(""))+" s");

row("Reserved",p.slice(4,6).join(""),"Fixed");

}

function isAck(p){
return p.length===2&&p.join("")==="4f6b";
}

function ackRow(p){
row("Data",p.join(""),"'Ok' - Successfully configured","ok");
}

/* ============================================================
   0x25 Query Energy Data / Server response
   ============================================================ */

function decode25(b){

frameType("2.1 Query Energy Data / Server Response (0x25)");

row("Frame Head",b[0],"Data frame start");
row("Length",b[1],hexToInt(b[1])+" bytes (total frame length)");

lengthCheck(hexToInt(b[1]),b.length);

addressRow(b.slice(2,6));

row("Contents",b[6],b[6]==="ff"?"0xFF - Fixed":"Unexpected");

crcTail(b);

}

/* ============================================================
   0x26 Query Energy Data response
   ============================================================ */

function decode26(b){

frameType("2.1 Query Energy Data - Response (0x26)");

row("Frame Head",b[0],"Data frame start");

row("Length",b[1],hexToInt(b[1])+" bytes (total frame length)");

lengthCheck(hexToInt(b[1]),b.length);

   3.1 Response - full status frame (0x11)
   ============================================================ */

function decodeICODE(bytes){

frameType("3.1 Lighting / dimming command - Response (0x11)");

row("Frame head",bytes[0],"Data frame start");

row("Length",bytes[1],hexToInt(bytes[1])+" bytes (total frame length)");

lengthCheck(hexToInt(bytes[1]),bytes.length);

addressRow(bytes.slice(2,6));

row("Dimming port",bytes[6],"0x04 - Fixed");
row("Dimming function code",bytes[7],"0x10 - Fixed");

row("Dimming value",
bytes[8],
hexToInt(bytes[8])+" %");

row("Turn on/off port",bytes[9],"0x05 - Fixed");
row("Turn on/off function code",bytes[10],"0x04 - Fixed");

row("Turn on/off status",
bytes[11],
bytes[11]==="00"?"ON":"OFF");

row("Collection port",bytes[12],"0x00 - Fixed");
row("Collection function code",bytes[13],"0x20 - Fixed");
row("Effective length",bytes[14],"0x0C - Fixed");

row("Voltage",
bytes.slice(15,17).join(""),
hexToInt(bytes.slice(15,17).join(""))/100+" V");

row("Current",
bytes.slice(17,19).join(""),
hexToInt(bytes.slice(17,19).join(""))/1000+" A");

row("Active Power",
bytes.slice(19,21).join(""),
hexToInt(bytes.slice(19,21).join(""))/10+" W");

row("Reactive Power",
bytes.slice(21,23).join(""),
hexToInt(bytes.slice(21,23).join(""))/10+" VAR");

row("Frequency",
bytes.slice(23,25).join(""),
hexToInt(bytes.slice(23,25).join(""))/100+" Hz");

row("Active Energy",
bytes.slice(25,29).join(""),
hexToInt(bytes.slice(25,29).join(""))/100+" kWh");

let tempHex=bytes.slice(29,31).join("");

let temp=(hexToSigned16(tempHex)-10000)/100;

row("Temperature",tempHex,temp+" °C");

let timeHex=bytes.slice(31,34).join("");

row("Time",timeHex,formatTimeUTC7(timeHex)+" (UTC+7)");

let dateHex=bytes.slice(34,37).join("");

row("Date",dateHex,formatDateWithOverflow(dateHex));

let idx=37;

function get4(name,signed=false,unit=""){

let hex=bytes.slice(idx,idx+4).join("");

let val=signed?
hexToSigned32(hex):
hexToInt(hex);

row(name,hex,val+(unit?" "+unit:""));

idx+=4;

}

get4("Signal Power",true,"dBm");
get4("Total Power",true,"dBm");
get4("Tx Power",true,"dBm");
get4("Tx Time",false,"ms");
get4("Rx Time",false,"ms");
get4("Cell ID");
get4("ECL");
get4("SNR",true,"dB");
get4("Earfcn");
get4("PCI");
get4("RSRQ",true,"dB");

/* remaining : working times 4 + restart 2 [+ photo adc 1] + crc 2 */

let remaining=bytes.length-idx;

row("Device Working Times",
bytes.slice(idx,idx+4).join(""),
hexToInt(bytes.slice(idx,idx+4).join(""))+" min");

idx+=4;

row("Restart Times",
bytes.slice(idx,idx+2).join(""),
hexToInt(bytes.slice(idx,idx+2).join("")));

idx+=2;

if(remaining>=9){

row("Photo ADC",
bytes[idx],
hexToInt(bytes[idx])*10+" mV (ADC "+hexToInt(bytes[idx])+")");

idx++;

}

crcTail(bytes);

}

/* ============================================================
   FRAME BUILDER
   ============================================================ */

function encInt(n,bytes){

let v=Math.round(Number(n));

if(!isFinite(v)||v<0)v=0;

return (v>>>0).toString(16).padStart(bytes*2,'0').slice(-bytes*2).toLowerCase();

}

function encAscii(s){

let out="";

s=s||"";

for(let i=0;i<s.length;i++)
out+=(s.charCodeAt(i)&0xFF).toString(16).padStart(2,'0');

return out;

}

function encAddr(s){

let h=(s||"").replace(/[^0-9a-fA-F]/g,'');

return h.padStart(8,'0').slice(-8).toLowerCase();

}

function encTime(s){

let p=(s||"").split(":");

return encInt(p[0]||0,1)+encInt(p[1]||0,1)+encInt(p[2]||0,1);

}

function encIP(s){

let p=(s||"").split(".");

let out="";

for(let i=0;i<4;i++)
out+=encInt(p[i]||0,1);

return out;

}

function crcOf(hex){
return calcCRC16(hex.match(/.{2}/g)||[]);
}

/* head + length (total frame length) + body + CRC */

function tailFrame(head,lenBytes,body){

let total=1+lenBytes+body.length/2+2;

let core=head+encInt(total,lenBytes)+body;

return core+crcOf(core);

}

/* 0xAA55 command frame : length = bytes after CRC16 */

function aa55Frame(payload){

return "aa55"+encInt(payload.length/2,2)+"01000300"+crcOf(payload)+payload;

}

/* execution function : 0500 On / 0501 Off / 04XX dimming */

function encFunc(mode,level){
return mode==="04"?"04"+encInt(level,1):mode;
}

/* signed 32-bit */

function encI32(n){

let v=Math.round(Number(n));

if(!isFinite(v))v=0;

return ((v|0)>>>0).toString(16).padStart(8,'0');

}

/* BCD : two decimal digits per byte, the digits are the nibbles */

function encBCD(s,bytes){

return (s||"").replace(/\D/g,'').slice(0,bytes*2).padEnd(bytes*2,'0');

}

/* time transmitted as SS MM HH */

function encTimeRev(s){

let p=(s||"").split(":");

return encInt(p[2]||0,1)+encInt(p[1]||0,1)+encInt(p[0]||0,1);

}

/* date transmitted as DD MM YY */

function encDate(s){

let p=(s||"").split(/[\/\-\.]/);

return encInt(p[0]||0,1)+encInt(p[1]||0,1)+encInt((p[2]||0).toString().slice(-2),1);

}

/* firmware version "1.1.8" */

function encFW(s){

let p=(s||"").split(".");

return encInt(p[0]||0,1)+encInt(p[1]||0,1)+encInt(p[2]||0,1);

}

/* 0xAA55 registration / heartbeat : length = total frame length */

function aa55Reg(payload){

return "aa55"+encInt(payload.length/2+10,2)+"03000300"+crcOf(payload)+payload;

}

opts:[["00","0x00 - Success"],["01","0x01 - Length Error"],["02","0x02 - MD5 Error"],
["03","0x03 - Failed running FOTA"],["04","0x04 - Not bin file"],["05","0x05 - Download FOTA Failed"]]}],
b:v=>tailFrame("52",2,v.st)},

{g:D,n:"2.2 Query Time Strategy Response (0xAA55 / 0xD3)",
f:[F_ADDR,F_STRATEGY,F_ENABLE,
{id:"t1",label:"Execution time 1 (HH:MM:SS)",type:"text",def:"18:00:30"},
{id:"m1",label:"Execution function 1",type:"select",def:"04",opts:FUNC_OPTS},

+encTime(v.t2)+encFunc(v.m2,v.l2))},

b:v=>aa55Frame(encAddr(v.addr)+v.fc+"4f6b")},

{g:D,n:"5.1 Registration Packet (0xAA55 / 0xD0)",
f:[F_ADDR,
{id:"imei",label:"IMEI (16 digit BCD)",type:"text",def:"0867856051234567"},
{id:"imsi",label:"IMSI (16 digit BCD)",type:"text",def:"0510890123456789"},
{id:"csq",label:"CSQ",type:"num",def:24,min:0,max:99},

+"07"+encBCD(v.imei,8)+"08"+encBCD(v.imsi,8)
+"03"+encInt(v.csq,1)+"05"+encInt(v.pci,1)
+"09"+encFW(v.fw)+encInt(v.tz,1))},

{g:D,n:"5.2 Heartbeat Packet (0xAA55 / 0xD0)",
f:[F_ADDR,
{id:"imei",label:"IMEI (16 digit BCD)",type:"text",def:"0867856051234567"},
{id:"csq",label:"CSQ",type:"num",def:24,min:0,max:99},

b:v=>aa55Reg(encAddr(v.addr)+"d0"
+"07"+encBCD(v.imei,8)

];

function initBuilder(){

let s=document.getElementById("cmd");

let html="";
let group="";

BUILDERS.forEach((x,i)=>{

if(x.g!==group){

if(group)html+='</optgroup>';

html+='<optgroup label="'+x.g+'">';

group=x.g;

}

html+='<option value="'+i+'">'+x.n+'</option>';

});

s.innerHTML=html+'</optgroup>';

renderForm();

}

function renderForm(){

let d=BUILDERS[document.getElementById("cmd").value]||BUILDERS[0];

let html="";

for(let f of d.f){

html+='<div class="field"><label for="f_'+f.id+'">'+f.label+'</label>';

if(f.type==="select"){

html+='<select id="f_'+f.id+'" onchange="buildNow()">'
+f.opts.map(o=>'<option value="'+o[0]+'"'+(o[0]===f.def?" selected":"")+'>'+o[1]+'</option>').join("")
+'</select>';

}else if(f.type==="num"){

html+='<input id="f_'+f.id+'" type="number" value="'+f.def+'" min="'+f.min+'" max="'+f.max+'" oninput="buildNow()">';

}else{

html+='<input id="f_'+f.id+'" type="text" value="'+f.def+'" oninput="buildNow()">';

}

html+='</div>';

}

document.getElementById("form").innerHTML=html;

buildNow();

syncFields();

}

function buildNow(){

let d=BUILDERS[document.getElementById("cmd").value]||BUILDERS[0];

let v={};

let warn=[];

for(let f of d.f){

let el=document.getElementById("f_"+f.id);

v[f.id]=el.value;

if(f.type==="num"){

let n=Number(el.value);

if(!isFinite(n)||n<f.min||n>f.max)
warn.push(f.label+" di luar rentang "+f.min+"-"+f.max);

}

if(f.id==="addr"&&!/^[0-9a-fA-F]{1,8}$/.test(el.value.replace(/\s/g,'')))
warn.push("Address harus 1-8 digit hex");

if(f.type==="text"&&f.id.match(/^t[12]$/)&&!/^\d{1,2}:\d{1,2}:\d{1,2}$/.test(el.value))
warn.push(f.label+" harus format HH:MM:SS");

}

syncFields();

let hex=d.b(v).toUpperCase();

document.getElementById("built").innerText=hex;

let info=document.getElementById("builtInfo");

info.innerText=(hex.length/2)+" byte - CRC16 0x"+hex.slice(-4)
+(warn.length?"  |  "+warn.join("  |  "):"");

info.className=warn.length?"muted err":"muted";

}

/* only show fields that matter for the current selection */

function syncFields(){

let pa=document.getElementById("f_pa");
let adc=document.getElementById("f_adc");

if(pa&&adc&&adc.parentNode)
adc.parentNode.style.display=(pa.value==="1")?"flex":"none";

for(let i of [1,2]){

let m=document.getElementById("f_m"+i);
let l=document.getElementById("f_l"+i);

if(m&&l&&l.parentNode)
l.parentNode.style.display=(m.value==="04")?"flex":"none";

}

}

function copyBuilt(){

let t=document.getElementById("built").innerText;

navigator.clipboard.writeText(t).then(()=>{

let b=document.getElementById("copyBtn");

b.innerText="Tersalin";

setTimeout(()=>{b.innerText="Copy";},1200);

},()=>{});

}

function decodeBuilt(){

document.getElementById("hexInput").value=document.getElementById("built").innerText;

showTab("decode");

parse();

}

function showTab(t){

document.getElementById("tab-decode").style.display=(t==="decode")?"block":"none";
document.getElementById("tab-build").style.display=(t==="build")?"block":"none";

document.getElementById("btn-decode").className=(t==="decode")?"tab active":"tab";
document.getElementById("btn-build").className=(t==="build")?"tab active":"tab";

}

/* UX FEATURES */

initBuilder();

const hexBox=document.getElementById("hexInput");

hexBox.addEventListener("focus",()=>{
if(hexBox.value.length>0)
hexBox.select();
});

hexBox.addEventListener("paste",e=>{
e.preventDefault();
let text=(e.clipboardData||window.clipboardData).getData("text");
hexBox.value=text.replace(/\s/g,'');
parse();
});

hexBox.addEventListener("dragover",e=>{
e.preventDefault();
hexBox.classList.add("drag");
});

hexBox.addEventListener("dragleave",()=>{
hexBox.classList.remove("drag");
});

hexBox.addEventListener("drop",e=>{
e.preventDefault();
hexBox.classList.remove("drag");

let text=e.dataTransfer.getData("text");

if(text){
hexBox.value=text.replace(/\s/g,'');
parse();
}

});

</script>
